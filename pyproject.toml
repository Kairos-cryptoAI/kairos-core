[build-system]
requires = ["hatchling>=1.31.0,<2"]
build-backend = "hatchling.build"

[project]
name = "kairos-core"
version = "0.2.0"
description = "Shared contracts, message bus, config and logging for the Kairos AI futures trader."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "TheLitis" }]
dependencies = [
    "aiohttp>=3.10,<4",
    "orjson>=3.9,<4",
    "prometheus-client>=0.21,<1",
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "redis>=6.4,<9",
    "structlog>=24.1,<27",
]

[dependency-groups]
dev = [
    "bandit>=1.8,<2",
    "build>=1.2,<2",
    "mypy>=1.10,<3",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.16,<0.17",
]

[tool.uv]
required-version = "==0.12.3"

[tool.hatch.build.targets.wheel]
packages = ["kairos_core"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
