name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python-version: "3.11"
          - os: ubuntu-latest
            python-version: "3.14"
          - os: windows-latest
            python-version: "3.11"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked environment
        run: uv sync --locked
      - name: Lint
        run: uv run --locked ruff check kairos_core tests
      - name: Check formatting
        run: uv run --locked ruff format --check kairos_core tests
      - name: Type check
        run: uv run --locked mypy kairos_core
      - name: Security scan
        run: uv run --locked bandit -q -r kairos_core -x tests
      - name: Test
        run: uv run --locked pytest -q --tb=short
      - name: Build wheel and source distribution
        run: uv build --no-sources

  redis-integration:
    name: Redis 8.2 integration
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.2.8-alpine3.22
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      KAIROS_TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Sync locked environment
        run: uv sync --locked
      - name: Run Redis integration tests
        run: uv run --locked pytest -q --tb=short tests/test_bus_redis_integration.py
